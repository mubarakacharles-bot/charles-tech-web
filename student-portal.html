<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Charles Tech – Attendance & Stock</title>
<style>
:root{
  --bg:#eef3fb;--card:#ffffff;--ink:#0f1b3d;--mut:#64708f;--bd:#e0e7f5;--track:#e6edfa;
  --pri:#2563eb;--pri2:#1d4ed8;--acc:#06b6d4;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
  --side1:#0a1a4f;--side2:#1e40af;--shadow:0 8px 28px rgba(30,64,175,.09);--r:16px;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#040a1c;--card:#0a1432;--ink:#e8efff;--mut:#8a9bc7;--bd:#18285a;--track:#12204a;
  --pri:#3b82f6;--pri2:#1d4ed8;--acc:#22d3ee;--ok:#22c55e;--warn:#f59e0b;--bad:#f43f5e;
  --side1:#030818;--side2:#0b1f66;--shadow:0 10px 34px rgba(0,0,0,.5);color-scheme:dark;
}
[data-theme=dark] body{background:radial-gradient(900px 520px at 88% -8%,rgba(37,99,235,.28),transparent 62%),radial-gradient(700px 420px at -6% 45%,rgba(6,182,212,.12),transparent 60%),var(--bg);background-attachment:fixed}
[data-theme=dark] .card,[data-theme=dark] .stat{background:linear-gradient(180deg,rgba(59,130,246,.09),transparent 45%),var(--card);box-shadow:var(--shadow),inset 0 1px 0 rgba(120,160,255,.14)}
[data-theme=dark] .bar{box-shadow:0 0 20px color-mix(in srgb,var(--c,var(--acc)) 50%,transparent)}
[data-theme=dark] .arc{filter:drop-shadow(0 0 5px currentColor)}
[data-theme=dark] .nb.on{background:linear-gradient(90deg,rgba(59,130,246,.35),rgba(59,130,246,.08));box-shadow:inset 0 0 0 1px rgba(96,165,250,.3),0 0 22px rgba(59,130,246,.25)}
[data-theme=dark] .topbar{background:color-mix(in srgb,#040a1c 78%,transparent)}
[data-theme=dark] button:not(.sec):not(.nb):not(.iconbtn){box-shadow:0 4px 18px rgba(59,130,246,.45)}
[data-theme=dark] th{background:rgba(59,130,246,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
h1{font-size:clamp(20px,2.4vw,26px);margin:0}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:18px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.mut{color:var(--mut);font-size:13px}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;
  background:radial-gradient(1200px 600px at 10% -10%,#3b82f6 0,transparent 60%),radial-gradient(900px 500px at 100% 110%,#06b6d4 0,transparent 55%),linear-gradient(135deg,#0a1a4f,#1e3a8a)}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 14s ease-in-out infinite}
#login::before{width:340px;height:340px;background:#60a5fa;top:-80px;left:-60px}
#login::after{width:300px;height:300px;background:#22d3ee;bottom:-90px;right:-40px;animation-delay:-7s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
.glass{position:relative;z-index:1;width:100%;max-width:410px;padding:30px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 20px 60px rgba(0,0,20,.4);color:#fff;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.glass .logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#60a5fa,#06b6d4);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(6,182,212,.45)}
.glass .logo svg{width:28px;height:28px}
.glass label{color:#dbe8ff}.glass .mut{color:#c3d4f7}
.glass input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.glass input::placeholder{color:#b8c9ee}
.glass input:focus{background:rgba(255,255,255,.22);border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.glass .err{color:#fecaca}

/* ---------- form controls ---------- */
label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--card);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
button{padding:10px 16px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;cursor:pointer;font-weight:650;
  box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 35%,transparent);transition:transform .15s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-1px);filter:brightness(1.07)}button:active{transform:none}
button.sec{background:color-mix(in srgb,var(--pri) 12%,var(--card));color:var(--pri);box-shadow:none}
button.ok{background:linear-gradient(135deg,#22c55e,var(--ok))}button.bad{background:linear-gradient(135deg,#ef4444,var(--bad))}
button.sm{padding:5px 10px;font-size:13px;border-radius:9px}
button:disabled{opacity:.5;cursor:not-allowed}
.err{font-size:13px;margin-top:10px;min-height:18px;color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;color:#dbe6ff;
  background:linear-gradient(180deg,var(--side1),var(--side2));overflow-y:auto;z-index:20;transition:transform .3s}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#60a5fa,#06b6d4);display:grid;place-items:center}
.brand svg{width:22px;height:22px}
.grp{font-size:11px;font-weight:800;letter-spacing:.12em;color:#8fa8e8;padding:16px 10px 6px}
.nb{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin:2px 0;border-radius:12px;background:transparent;color:#cfdcff;box-shadow:none;font-weight:600;text-align:left;position:relative}
.nb svg{width:19px;height:19px;flex:none}
.nb:hover{background:rgba(255,255,255,.1);transform:none;filter:none}
.nb.on{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.nb.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#22d3ee}
.sfoot{margin-top:auto;padding-top:14px}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px clamp(14px,3vw,30px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.topbar .sp{flex:1}
.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:12px;background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--bd)}
.iconbtn svg{width:19px;height:19px}
#burger{display:none}
.chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.chip small{display:block;color:var(--mut);font-weight:500;font-size:11px;line-height:1.1}
main{padding:clamp(14px,3vw,30px);max-width:1180px;width:100%;margin:0 auto}
.pagehead{margin-bottom:20px;animation:rise .45s ease both}
.scrim{position:fixed;inset:0;background:rgba(5,10,30,.5);z-index:15}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:var(--shadow);animation:rise .5s ease both}
.grid2{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.grid2>.card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:18px}
.stat{position:relative;overflow:hidden;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow);animation:rise .5s var(--d,0ms) ease both}
.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--pri)) 16%,transparent)}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px;color:#fff;background:linear-gradient(135deg,var(--c,var(--pri)),color-mix(in srgb,var(--c,var(--pri)) 60%,#000))}
.stat .ic svg{width:19px;height:19px}
.stat b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--mut);font-size:13px;font-weight:600}

/* ---------- tables ---------- */
.wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:color-mix(in srgb,var(--pri) 5%,var(--card));position:sticky;top:0}
tbody tr{transition:background .15s}tbody tr:hover{background:color-mix(in srgb,var(--pri) 6%,transparent)}
.tag{white-space:nowrap;display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:750;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.t-ok{--c:var(--ok)}.t-bad{--c:var(--bad)}.t-warn{--c:var(--warn)}.t-info{--c:var(--pri)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);padding:12px 16px;border-radius:14px;margin-bottom:18px;font-weight:650}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:150px}
.empty{padding:26px;text-align:center;color:var(--mut)}

/* ---------- attendance marking ---------- */
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg label{margin:0;font-weight:650;padding:6px 11px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;font-size:13px;display:flex;gap:5px;align-items:center;transition:all .15s;user-select:none}
.seg label:hover{border-color:var(--pri)}
.seg input{width:auto;margin:0;accent-color:var(--pri)}
.seg label.P:has(input:checked){--c:var(--ok)}.seg label.L:has(input:checked){--c:var(--warn)}.seg label.A:has(input:checked){--c:var(--bad)}.seg label.E:has(input:checked){--c:var(--pri)}
.seg label:has(input:checked){background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c);color:var(--c)}
.livebar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.livebar .tag{font-size:13px}

.lban{height:96px;border-radius:14px;margin-bottom:14px;background:var(--ban) center/cover;border:1px solid rgba(255,255,255,.25)}
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:150px;margin-bottom:18px;background:linear-gradient(90deg,rgba(2,12,40,.1),rgba(2,12,40,.65)),var(--ban) center/cover;border:1px solid var(--bd);box-shadow:var(--shadow);display:flex;align-items:flex-end;justify-content:flex-end;padding:14px 18px}
.hero .hc{font:800 30px ui-monospace,Consolas,monospace;color:#fff;text-shadow:0 0 14px #00d4ffaa;text-align:right}
.hero small{display:block;font:600 12px system-ui;color:#bfe9ff;text-align:right}
.clk2{font:800 22px ui-monospace,Consolas,monospace;color:var(--acc)}
.strip{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.strip i{width:10px;height:18px;border-radius:3px;background:var(--track);animation:pop2 .35s var(--d,0ms) both}
@keyframes pop2{from{transform:scaleY(0);opacity:0}}
.strip i.P{background:var(--ok)}.strip i.L{background:var(--warn)}.strip i.E{background:var(--pri)}.strip i.A{background:var(--bad)}
.strip i.t{outline:2px solid var(--acc);outline-offset:1px}
tr.clk{cursor:pointer}
/* ---------- charts ---------- */
.bars{display:flex;align-items:stretch;gap:clamp(6px,1.4vw,14px);height:210px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:2px solid var(--bd)}
.bar{width:min(100%,38px);height:var(--h);border-radius:9px 9px 0 0;background:linear-gradient(180deg,var(--c,var(--acc)),color-mix(in srgb,var(--c,var(--pri)) 55%,var(--pri2)));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.3,1) var(--d,0ms) both;transition:filter .2s}
.bar:hover{filter:brightness(1.15)}
@keyframes grow{from{transform:scaleY(0)}}
.bval{font-size:12px;font-weight:750;margin-bottom:4px;color:var(--ink)}
.blbl{font-size:12px;color:var(--mut);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.donutw{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.donut{width:170px;height:170px;flex:none}
.arc{fill:none;stroke-width:16;stroke-linecap:butt;animation:arc .9s ease var(--d,0ms) both}
@keyframes arc{from{opacity:0;stroke-width:4}}
.dc{font-size:25px;font-weight:800;fill:var(--ink)}.ds{font-size:9.5px;fill:var(--mut);font-weight:600}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:8px}
.legend b{margin-left:6px}
.pb{height:9px;border-radius:99px;background:var(--track);overflow:hidden;min-width:70px}
.pb i{display:block;height:100%;border-radius:99px;background:var(--c,var(--pri));animation:fill .9s ease both;transform-origin:left}
@keyframes fill{from{transform:scaleX(0)}}
.lrow{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr auto;gap:12px;align-items:center;padding:8px 0}
.lrow+.lrow{border-top:1px dashed var(--bd)}
.lrow b{font-size:13px;min-width:44px;text-align:right}

/* ---------- modal & toast ---------- */
#modalbg{position:fixed;inset:0;background:rgba(5,10,30,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#modal{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:10px;z-index:99}

<script>
'use strict';
/* ================= helpers ================= */
/* ========== ADMINISTRATOR = WEBSITE SESSION ==========
   Only an active server-side website administrator session can open this dashboard. */
let SITE_ADMIN=null,ADM_EMAIL='',portalRevision=0,portalRemoteReady=false,portalCsrf='',portalServerAvailable=false,localPortalCopyExists=false;
const isSiteAdminUser=u=>!!(u&&ADM_EMAIL&&u.u===ADM_EMAIL);
const portalApiUrl=new URL('api/portal.php',document.baseURI).href;
async function portalRequest(method='GET',state=null){
  const options={method,credentials:'same-origin',headers:{'Accept':'application/json'}};
  if(method==='PUT'||method==='POST'){
    options.headers['Content-Type']='application/json';
    options.headers['X-CSRF-Token']=portalCsrf;
    options.body=JSON.stringify(method==='PUT'?{state,revision:portalRevision}:state);
  }
  const response=await fetch(portalApiUrl,options);
  let payload={};
  try{payload=await response.json()}catch(error){throw new Error('The portal database returned an invalid response.')}
  if(!response.ok)throw new Error(payload.error||'Could not connect to the portal database.');
  if(typeof payload.csrfToken==='string')portalCsrf=payload.csrfToken;
  return payload;
}
async function portalStudentRequest(method='GET',payload=null){
  const options={method,credentials:'same-origin',headers:{'Accept':'application/json'}};
  if(method!=='GET'){
    options.headers['Content-Type']='application/json';
    options.headers['X-CSRF-Token']=portalCsrf;
    options.body=JSON.stringify(payload||{});
  }
  const response=await fetch(new URL('api/portal-students.php',document.baseURI),options);
  let result={};
  try{result=await response.json()}catch(error){throw new Error('The student portal service returned an invalid response.')}
  if(!response.ok)throw new Error(result.error||'Could not connect to the student portal service.');
  if(typeof result.csrfToken==='string')portalCsrf=result.csrfToken;
  return result;
}
const KEY='sas_data_v1', LKEY='sas_lock_v1', TKEY='sas_theme', PEPPER='sas-seal-2026', IDLE_MS=5*60*1000, MAXFAIL=5, LOCK_MS=5*60*1000;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const localNow=()=>Date.now()-new Date().getTimezoneOffset()*60000;
const today=()=>new Date(localNow()).toISOString().slice(0,10);
const lastDays=n=>Array.from({length:n},(_,i)=>new Date(localNow()-(n-1-i)*864e5).toISOString().slice(0,10));
const dayLbl=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short'});
const clean=(s,n=60)=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,n);
const enc=s=>new TextEncoder().encode(s);
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const HAS=!!(window.crypto&&crypto.subtle);
const fmt=n=>Number(n).toLocaleString();

const IC={
  task:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 check:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="M9 14l2 2 4-4"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 swap:'<path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
 warn:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
 pct:'<path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22M14.1 14.1a3 3 0 1 1-4.2-4.2"/>'
};
const ic=(n,w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

async function sha(s){
  if(HAS)return hex(await crypto.subtle.digest('SHA-256',enc(s)));
  let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  return (h1>>>0).toString(16)+(h2>>>0).toString(16);
}
async function hashPw(pw,salt){
  if(!HAS)return sha(salt+pw);
  const k=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:150000,hash:'SHA-256'},k,256));
}
const newSalt=()=>HAS?hex(crypto.getRandomValues(new Uint8Array(16))):uid()+uid();
function safeEq(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
function csvCell(v){v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type==='bad'?' bad':'');t.textContent=msg;$('toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400)},3200)}


/* ================= hide mode (masked input) ================= */
const peekT={};
function peek(id,b){
  const el=$(id);clearTimeout(peekT[id]);
  if(el.type==='password'){el.type='text';b.innerHTML=ic('eyeoff');peekT[id]=setTimeout(()=>{el.type='password';b.innerHTML=ic('eye')},4000)}
  else{el.type='password';b.innerHTML=ic('eye')}
}
const pwf=(id,ac='off')=>`<div class="pw"><input id="${id}" type="password" autocomplete="${ac}" maxlength="100"><button type="button" class="eye" onclick="peek('${id}',this)" aria-label="Show or hide">${ic('eye')}</button></div>`;
function hideMode(){const on=$('hm').checked;$('lu').type=on?'password':'text';document.querySelectorAll('#login .eye').forEach(b=>b.innerHTML=ic('eye'))}
['lu','lp','lp2'].forEach(id=>$(id).addEventListener('keyup',e=>{$('caps').classList.toggle('hide',!(e.getModifierState&&e.getModifierState('CapsLock')))}));
$('lu').addEventListener('keydown',e=>{if(e.key==='Enter')$('lp').focus()});


/* ================= student self-registration ================= */
let regMode=false;
function toggleReg(){
  regMode=!regMode;
  $('regf').classList.toggle('hide',!regMode);$('lp2w').classList.toggle('hide',!regMode);
  $('lbtn').textContent=regMode?'Create my account':'Sign in';
  $('regTog').textContent=regMode?'Back to sign in':'New student? Create your account';
  $('lp').autocomplete=regMode?'new-password':'current-password';
  $('lerr').textContent='';
  $('rcl').innerHTML=classes().map(c=>'<option value="'+esc(c)+'">').join('');
}
async function doRegister(){
  const err=$('lerr');err.textContent='';
  const name=clean($('rn').value,60),reg=clean($('rr').value,30),cls=clean($('rc').value,30),u=clean($('lu').value,30).toLowerCase(),p=$('lp').value;
  if(name.length<3){err.textContent='Enter your full name.';return}
  if(reg.length<2){err.textContent='Enter your registration number.';return}
  if(!cls){err.textContent='Enter your class or group.';return}
  const ph=normPhone($('rph').value);if(!ph){err.textContent='Enter a valid phone number, e.g. 0788 123 456';return}
  if(!/^[a-z0-9_.]{3,30}$/.test(u)){err.textContent='Username: 3-30 letters, numbers, . or _';return}
  if(p.length<8){err.textContent='Password must be at least 8 characters.';return}
  if(p!==$('lp2').value){err.textContent='Passwords do not match.';return}
  try{
    const result=await portalStudentRequest('POST',{action:'register',username:u,name,registrationNumber:reg,className:cls,phone:ph,password:p});
    await acceptStudentSession(result);
    regMode=false;$('regf').classList.add('hide');['rn','rr','rc','rph'].forEach(i=>$(i).value='');
    enter();toast('Account created. Welcome, '+S.name.split(' ')[0]+'!');
  }catch(error){err.textContent=error.message;console.error('Student registration failed.',error)}
}

async function acceptStudentSession(result){
  if(!result.user||result.user.role!=='student'||!Array.isArray(result.state&&result.state.users)
    ||!Array.isArray(result.state.students))throw new Error('The student portal returned an invalid account record.');
  db=Object.assign(blank(),result.state);migrate();tampered=false;
  portalRevision=Number(result.revision)||0;portalRemoteReady=true;
  S={u:result.user.u,name:result.user.name,role:'student',id:result.user.id,sid:result.user.sid};
}

/* ================= student portal (view only) ================= */
function vMe(){
  const s=db.students.find(x=>x.id===S.sid);
  const top=`<div class="card"><h2>${esc(S.name)}</h2><div class="mut">Your attendance is recorded by the administrator. You can only view it here.</div><div class="mut" style="margin-top:6px">\ud83d\udcde ${s&&s.phone?esc(s.phone):'No phone saved'} · you can sign in with this number, and the administrator can message you on it (WhatsApp / SMS).</div><div class="acts"><button class="sec" onclick="phoneForm('${S.sid}')">Update my phone</button><button class="sec" onclick="changePw(false)">Change my password</button></div></div>`;
  if(!s)return top+'<div class="card empty">Your student record was not found. Please ask the administrator.</div>';
  const st=periodOf(today())||curStart(),x=marksOf(s,st),sg=standing(x.rate);
  const rows=x.days.map((d,i)=>{const r=recOf(d,s.cls),m=r&&r.marks[s.id];if(!m)return '';const t=r.times&&r.times[s.id];

const PEND={},MAXIMG=4;
const cleanCode=s=>String(s||'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').slice(0,4000);
function thumbs(key){return (PEND[key]||[]).map((s,i)=>`<span class="th"><img src="${s}" alt="photo" onclick="zoom(this.src)"><button type="button" class="x" onclick="rmImg('${key}',${i})">\u00d7</button></span>`).join('')}
function attachUI(key,init){if(!PEND[key])PEND[key]=(init||[]).slice();
  return `<div class="drop" data-key="${key}" ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="dropImgs(event,'${key}')">

  <div class="dz-b"><label class="filebtn">\ud83d\uddbc Gallery / files<input type="file" accept="image/*,.heic,.heif,.avif,.webp,.gif,.bmp,.svg,.jfif" multiple hidden onchange="addImgs('${key}',this.files);this.value=''"></label>
  <label class="filebtn cam">\ud83d\udcf8 Take photo<input type="file" accept="image/*" capture="environment" hidden onchange="addImgs('${key}',this.files);this.value=''"></label></div>
  <div class="mut dz-h">JPG \u00b7 PNG \u00b7 WebP \u00b7 GIF \u00b7 BMP \u00b7 AVIF \u00b7 SVG \u00b7 HEIC. Drag &amp; drop or paste (Ctrl+V). Pictures are resized automatically.</div>
  <div id="pv_${key}" class="ths">${thumbs(key)}</div></div>`}
const isImg=f=>(f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif|bmp|avif|svg|heic|heif|jfif)$/i.test(f.name||'');
async function addImgs(key,files){const fs=[...(files||[])];PEND[key]=PEND[key]||[];const pv=()=>$('pv_'+key);
  for(const f of fs){if(PEND[key].length>=MAXIMG){toast('Maximum '+MAXIMG+' photos','bad');break}
    if(!isImg(f)){toast('"'+f.name+'" is not a picture','bad');continue}
    if(f.size>25e6){toast('"'+f.name+'" is too large (max 25 MB)','bad');continue}
    if(pv())pv().innerHTML=thumbs(key)+'<span class="mut">Processing\u2026</span>';
    try{PEND[key].push(await shrink(f))}catch(e){toast('"'+f.name+'" could not be opened. For HEIC, set the camera to "Most Compatible" or save it as JPG.','bad')}}
  if(pv())pv().innerHTML=thumbs(key)}
function dropImgs(e,key){e.preventDefault();e.currentTarget.classList.remove('on');addImgs(key,e.dataTransfer.files)}
function rmImg(key,i){PEND[key].splice(i,1);const pv=$('pv_'+key);if(pv)pv.innerHTML=thumbs(key)}
document.addEventListener('paste',e=>{const fs=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(isImg);if(!fs.length)return;
  const a=document.activeElement,box=(a&&a.closest&&a.closest('.card')&&a.closest('.card').querySelector('.drop'))||document.querySelector('#view .drop');
  if(box){e.preventDefault();addImgs(box.dataset.key,fs)}});
async function decodeImg(f){
  if(window.createImageBitmap){try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}}
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>res(r.result);r.readAsDataURL(f)});
  return await new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>res(im);im.src=url})}
async function shrink(f){
  const im=await decodeImg(f),w0=im.width||im.naturalWidth||512,h0=im.height||im.naturalHeight||512;
  let dim=innerWidth<520?640:800,q=.58,out='';
  for(let n=0;n<4;n++){
    const k=Math.min(1,dim/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    out=c.toDataURL('image/webp',q);if(out.slice(5,15)!=='image/webp')out=c.toDataURL('image/jpeg',q);
    if(out.length<160000)break;dim=Math.round(dim*.8);q=Math.max(.4,q-.08)}
  if(im.close)im.close();return out}
function zoom(src){openModal(`<img src="${src}" alt="photo" style="max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px;display:block;margin:0 auto"><div class="acts"><button class="sec" onclick="closeModal()">Close</button></div>`)}

function codeKey(e){if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2}}
const codeView=c=>`<div class="cb"><button type="button" class="sec sm" onclick="copyCode(this)">Copy</button><pre><code>${esc(c)}</code></pre></div>`;
function copyCode(b){const t=b.parentNode.querySelector('code').innerText,ok=()=>toast('Code copied');

let db=null,S=null,tampered=false,tab='adash',idleT=null;
const blank=()=>({users:[],students:[],attendance:{},items:[],moves:[],log:[],cfg:{start:'',hist:[]},disc:{},tasks:[],subs:[],posts:[],sent:{},seal:''});
const body=d=>JSON.stringify({u:d.users,s:d.students,a:d.attendance,i:d.items,m:d.moves,l:d.log,c:d.cfg,d:d.disc});
const legacyBody=d=>JSON.stringify({u:d.users,s:d.students,a:d.attendance,i:d.items,m:d.moves,l:d.log});
function migrate(){
  let ch=false;
  ['tasks','subs','posts'].forEach(k=>{if(!Array.isArray(db[k])){db[k]=[];ch=true}});if(!db.sent||typeof db.sent!=='object'){db.sent={};ch=true}
  (db.users||[]).forEach(u=>{if(u.role!=='admin'&&u.role!=='student'){u.role='student';ch=true}});
  if(!db.cfg||typeof db.cfg!=='object'){db.cfg={start:'',hist:[]};ch=true}
  if(!Array.isArray(db.cfg.hist))db.cfg.hist=[];
  if(!db.disc||typeof db.disc!=='object'){db.disc={};ch=true}
  Object.values(db.attendance).forEach(r=>{for(const id in r.marks){const m=r.marks[id];
    if(m==='L'){r.marks[id]='P';ch=true}else if(m!=='P'&&m!=='A'){r.marks[id]='A';ch=true;if(r.times)delete r.times[id]}}});
  if(!db.cfg.start){const from=addDays(today(),-45),ds=Object.values(db.attendance).map(r=>r.date).filter(d=>d>=from&&d<=today()).sort();db.cfg.start=ds[0]||today();ch=true}
  return ch;
}
async function save(){
  clearCache();db.seal=await sha(body(db)+PEPPER);
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage is full. Remove old photos or tasks, or save a backup.','bad')}
  if(isAdmin()&&portalRemoteReady){
    try{const result=await portalRequest('PUT',db);portalRevision=result.revision}
    catch(error){toast(error.message,'bad');console.error('Could not save Student Portal data to MySQL.',error)}
  }
  if(S&&S.role==='student'&&portalRemoteReady){
    try{
      const result=await portalStudentRequest('PUT',{state:db,revision:portalRevision});
      portalRevision=result.revision;
    }catch(error){toast(error.message,'bad');console.error('Could not save student portal changes to the database.',error)}
  }
}
async function load(){
  const raw=localStorage.getItem(KEY);
  localPortalCopyExists=raw!==null;
  if(!raw){db=blank();migrate();return}
  try{db=Object.assign(blank(),JSON.parse(raw))}catch(e){db=blank();tampered=true;return}
  tampered=!(db.seal===await sha(body(db)+PEPPER)||db.seal===await sha(legacyBody(db)+PEPPER));
  if(migrate()&&!tampered)await save();
}
async function audit(a,d=''){
  const prev=db.log.length?db.log[db.log.length-1].h:'0',t=Date.now(),u=S?S.u:'-';
  db.log.push({t,u,a,d:clean(d,200),h:await sha(prev+t+u+a+clean(d,200))});
  if(db.log.length>3000)db.log.splice(0,db.log.length-3000);
}
async function verifyLog(){
  for(let i=1;i<db.log.length;i++){const e=db.log[i];
    if(e.h!==await sha(db.log[i-1].h+e.t+e.u+e.a+e.d))return i}
  return -1;
}

function lockState(){try{return JSON.parse(localStorage.getItem(LKEY))||{f:0,until:0}}catch(e){return{f:0,until:0}}}

async function init(){
  let t='dark';try{t=localStorage.getItem(TKEY)||'dark'}catch(e){}
  $('burger').innerHTML=ic('menu');document.querySelectorAll('#login .eye').forEach(b=>b.innerHTML=ic('eye'));$('yr').textContent=new Date().getFullYear();$('ico-out').innerHTML=ic('out');
  setTheme(t);
  await load();
  try{
    const response=await fetch(new URL('api/auth/me.php',document.baseURI),{credentials:'same-origin',headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('The website sign-in service returned HTTP '+response.status+'.');
    const session=await response.json();
    if(typeof session.csrfToken==='string')portalCsrf=session.csrfToken;
    if(session.user&&session.user.isAdmin){
      SITE_ADMIN=session.user;ADM_EMAIL=String(session.user.email||'').toLowerCase();$('lu').value=ADM_EMAIL;
      const portal=await portalRequest('GET');
      if(portal.state){
        portalRevision=Number(portal.state.revision)||0;portalServerAvailable=true;
        if(!localPortalCopyExists){
          db=Object.assign(blank(),JSON.parse(portal.state.state_json));migrate();tampered=false;
          portalRemoteReady=true;
        }
      }
      let admin=db.users.find(x=>isSiteAdminUser(x));
      if(!admin){admin={id:uid(),u:ADM_EMAIL,name:session.user.name||'Administrator',role:'admin',salt:'',h:'',mc:false,site:true};db.users.push(admin)}
      admin.role='admin';admin.site=true;admin.mc=false;
      if(session.user.name)admin.name=session.user.name;
      S={u:admin.u,name:admin.name,role:'admin',id:admin.id};
      await audit('LOGIN','website session');
      await save();
      $('login').classList.add('hide');$('app').classList.remove('hide');
      enter();
      return;
    }
    const studentSession=await portalStudentRequest('GET');
    if(studentSession.user){
      await acceptStudentSession(studentSession);
      $('login').classList.add('hide');$('app').classList.remove('hide');
      enter();
      return;
    }
  }catch(error){$('lerr').textContent=error.message;console.error('Could not connect the Student Portal to its server session or database.',error)}
  $('login').classList.remove('hide');
  $('setupNote').classList.remove('hide');$('lp2w').classList.add('hide');
  $('lbtn').textContent='Sign in';$('regTog').classList.remove('hide');
  if(!ADM_EMAIL&&!$('lerr').textContent)$('lerr').textContent='Administrator: sign in to the website first, then reopen this panel.';
}
async function doLogin(){
  if(regMode)return doRegister();
  const err=$('lerr');err.textContent='';
  const u=clean($('lu').value,80).toLowerCase(),p=$('lp').value;
  try{
    const result=await portalStudentRequest('POST',{action:'login',identifier:u,password:p});
    await acceptStudentSession(result);
    enter();
  }catch(error){
    const legacy=db.users.find(x=>x.u===u||String(db.students.find(s=>s.id===x.sid)?.phone||'').replace(/[\s\-().]/g,'')===u);
    err.textContent=legacy?'Your account is on the old browser copy. Ask the administrator to import that portal data before signing in.':error.message;
    console.error('Student sign-in failed.',error);
  }
}

  return `<div class="donutw"><svg viewBox="0 0 140 140" class="donut"><circle cx="70" cy="70" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="16"/><g transform="rotate(-90 70 70)">${arcs}</g><text x="70" y="70" text-anchor="middle" class="dc">${esc(center)}</text><text x="70" y="86" text-anchor="middle" class="ds">${esc(sub)}</text></svg>

/* ================= ATTENDANCE: 18-day industrial attachment marks system ================= */
/* Rules: 18 attendance days per period. Present = +5 marks, Absent = −5 marks (lost from 90).
   Attendance /90 + Discipline /10 (set by administrator) = Total /100 (%). */
const PDAYS=18,PTS=5,ATT_MAX=PDAYS*PTS,DISC_MAX=10;
const addDays=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const nowT=()=>{const d=new Date();return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')};
const recOf=(d,c)=>db.attendance[d+'|'+c];
const starts=()=>[...new Set([...(db.cfg.hist||[]),db.cfg.start].filter(Boolean))].sort();
const curStart=()=>db.cfg.start||today();
function periodOf(d){let s=null;starts().forEach(x=>{if(x<=d)s=x});return s}
function periodEnd(s){const st=starts(),i=st.indexOf(s);return i>=0&&i<st.length-1?st[i+1]:null}
const _pc=new Map(),_mc=new Map();function clearCache(){_pc.clear();_mc.clear()}
function pDays(cls,s){if(!s)return [];const ck=cls+'|'+s,hit=_pc.get(ck);if(hit)return hit;const r=pDays0(cls,s);_pc.set(ck,r);return r}
function pDays0(cls,s){if(!s)return [];const e=periodEnd(s);return Object.values(db.attendance).filter(r=>r.cls===cls&&r.date>=s&&(!e||r.date<e)).map(r=>r.date).sort().slice(0,PDAYS)}
function marksOf(s,start){const ck=s.id+'|'+start,hit=_mc.get(ck);if(hit)return hit;const r=marksOf0(s,start);_mc.set(ck,r);return r}
function marksOf0(s,start){
  const days=pDays(s.cls,start);let P=0,A=0;
  days.forEach(d=>{const m=recOf(d,s.cls).marks[s.id];if(m==='P')P++;else if(m==='A')A++});
  const dv=db.disc[start+'|'+s.id],disc=dv==null?null:dv,tot=P+A,att=P*PTS;
  return {days,P,A,tot,att,lost:A*PTS,disc,total:Math.round((att+(disc||0))*10)/10,rate:tot?Math.round(P/tot*100):null};
}
const standing=p=>p==null?['t-info','No data']:p>=90?['t-ok','Excellent']:p>=75?['t-warn','Good']:['t-bad','At risk'];
const mk=m=>m==='P'?'<span class="tag t-ok">+5</span>':'<span class="tag t-bad">−5</span>';

/* ================= ATTENDANCE: overview ================= */
function dayStats(d){
  let p=0,a=0;
  Object.values(db.attendance).forEach(r=>{if(r.date===d)Object.values(r.marks).forEach(m=>{m==='P'?p++:a++})});
  const t=p+a;return {p,a,t,rate:t?Math.round(p/t*100):null};
}
function arrivalsToday(){const d=today(),out=[];Object.values(db.attendance).forEach(r=>{if(r.date===d&&r.times)Object.entries(r.times).forEach(([id,t])=>{const s=db.students.find(x=>x.id===id);if(s&&r.marks[id]==='P')out.push({s,t})})});return out.sort((a,b)=>b.t.localeCompare(a.t)).slice(0,8)}
function riskList(){
  const st=curStart(),res=[];
  db.students.forEach(s=>{const x=marksOf(s,st);if(x.tot>=3&&x.rate<75)res.push({s,x})});
  return res.sort((a,b)=>a.x.rate-b.x.rate).slice(0,8);
}

  return `${hero()}
  <div class="stats">

   ${stat('Absent today',fmt(t.a),'x','var(--bad)',140)}

  </div>

   <div class="card"><h2>Today's status</h2>${t.t?donut([{l:'Present',v:t.p,c:'var(--ok)'},{l:'Absent',v:t.a,c:'var(--bad)'}],t.rate+'%','present'):'<div class="empty">No attendance taken today yet.</div>'}</div>
   <div class="card"><h2>18-day period progress</h2><div class="mut" style="margin-bottom:6px">Period started ${st} · Present +5 · Absent −5 · out of ${ATT_MAX}</div>${rows||'<div class="empty">No classes yet.</div>'}</div>

/* ================= ATTENDANCE: take ================= */
let attDate=today(),attCls='',attTimes={},attKey='';
function slots(days){const a=days.slice();while(a.length<PDAYS)a.push(null);return a}
function strip(s,days,mark){return '<div class="strip">'+slots(days).map((d,i)=>{if(!d)return `<i style="--d:${i*14}ms" title="Day ${i+1}: not taken yet"></i>`;const r=recOf(d,s.cls),m=r&&r.marks[s.id],t=r&&r.times&&r.times[s.id];return `<i class="${m||''} ${d===mark?'t':''}" style="--d:${i*14}ms" title="Day ${i+1} · ${d} · ${m?status[m]+(m==='P'?' (+5)':' (−5)')+(t?' · arrived '+t:''):'no record'}"></i>`}).join('')+'</div>'}
function arrCell(id){const t=attTimes[id];return t?`<b>${t}</b>`:'<span class="mut">—</span>'}
function attBlock(){
  const st=periodOf(attDate);if(!st)return '';const days=pDays(attCls,st);
  if(days.length>=PDAYS&&!days.includes(attDate))return 'This class has completed its 18-day period (started '+st+'). '+(isAdmin()?'Start a new 18-day period in Reports.':'Ask the administrator to start a new 18-day period.');
  return '';
}
function vAtt(){

  if(attKey!==k){attKey=k;attTimes=Object.assign({},rec&&rec.times)}
  const st=periodOf(attDate),days=pDays(attCls,st),dayNo=days.includes(attDate)?days.indexOf(attDate)+1:Math.min(days.length+1,PDAYS),blk=attBlock();

   <div><label>Class</label><select onchange="attCls=this.value;render()">${cl.map(c=>`<option ${c===attCls?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
   <div><label>Date</label><input type="date" value="${attDate}" ${isAdmin()?'':`max="${today()}" min="${today()}"`} onchange="attDate=this.value||today();render()"></div>
   <div style="flex:0 0 auto"><label>Time now</label><div class="clk2 hclk">${new Date().toLocaleTimeString([],{hour12:false})}</div></div></div>
   ${st?`<div class="lrow" style="margin-top:12px"><span><b>Day ${dayNo} of ${PDAYS}</b><div class="mut">Period started ${st}</div></span>${pbar(days.length/PDAYS*100,'var(--acc)')}<b>${days.length}/${PDAYS}</b></div>`:''}
   <div class="mut" style="margin-top:6px">Present = <b style="color:var(--ok)">+5 marks</b> · Absent = <b style="color:var(--bad)">−5 marks</b> · Attendance /${ATT_MAX} + Discipline /${DISC_MAX} = Total /100</div>
   ${rec?`<p class="mut" style="margin-top:10px">Saved by <b>${esc(rec.by)}</b> on ${new Date(rec.at).toLocaleString()}. ${rec&&!isAdmin()?'🔒 Locked – only the administrator can change it.':'Administrator edit allowed.'}</p>`:''}
   <div class="livebar" id="attc" style="margin-top:14px"></div>
   <div class="wrap" onchange="attChange(event)"><table><thead><tr><th>#</th><th>Student · 18-day period</th><th>Arrival</th><th>Status</th></tr></thead><tbody>
   ${list.map((s,i)=>{const cur=rec&&rec.marks[s.id],x=marksOf(s,st),sg=standing(x.rate);return `<tr><td>${i+1}</td><td><b>${esc(s.name)}</b><div class="mut">${esc(s.reg)}</div>${strip(s,days,attDate)}<div class="mut" style="margin-top:6px">Marks: <b style="color:var(--ink)">${x.att}/${ATT_MAX}</b> · present ${x.P} · absent ${x.A}${x.A?` (−${x.lost})`:''} · <span class="tag ${sg[0]}">${x.rate==null?'no data':x.rate+'% · '+sg[1]}</span></div></td><td id="t_${s.id}">${arrCell(s.id)}</td><td><div class="seg">${Object.keys(status).map(c=>`<label class="${c}"><input type="radio" name="m_${s.id}" value="${c}" ${cur===c?'checked':''} ${locked?'disabled':''}>${status[c]} ${c==='P'?'+5':'−5'}</label>`).join('')}</div></td></tr>`}).join('')}</tbody></table></div>
   <div class="acts">${locked?'':`<button class="ok" onclick="saveAtt()">Save attendance</button><button class="sec" onclick="allP()">Mark unmarked as present</button>`}${rec&&Object.values(rec.marks).includes('A')?`<button class="sec" onclick="notifyAbsent()">\ud83d\udcf2 Notify absent students</button>`:''}</div></div>`;
}
function attCount(){
  const el=$('attc');if(!el)return;const c={P:0,A:0};
  document.querySelectorAll('#view input[type=radio]:checked').forEach(r=>c[r.value]++);
  const total=document.querySelectorAll('#view tbody tr').length,wait=total-(c.P+c.A);
  el.innerHTML=`<span class="tag t-ok">Present ${c.P}</span><span class="tag t-bad">Absent ${c.A}</span><span class="tag" style="--c:var(--mut)">Waiting ${wait}</span>`;
}
function setMark(id,v){
  if(!isAdmin())return;
  if(v==='P'){if(attDate===today()&&!attTimes[id])attTimes[id]=nowT()}else delete attTimes[id];
  const r=document.querySelector(`input[name=m_${id}][value=${v}]`);if(r)r.checked=true;
  const c=$('t_'+id);if(c)c.innerHTML=arrCell(id);
}
function attChange(e){const t=e.target;if(t&&t.type==='radio'){setMark(t.name.slice(2),t.value);attCount()}}
function allP(){if(!isAdmin())return;db.students.filter(s=>s.cls===attCls).forEach(s=>{const r=document.querySelector(`input[name=m_${s.id}]`);if(r&&!r.disabled&&!document.querySelector(`input[name=m_${s.id}]:checked`))setMark(s.id,'P')});attCount()}
async function saveAtt(){
  if(!isAdmin())return toast('Only the administrator can take attendance.','bad');
  if(!isAdmin()&&attDate!==today())return toast('You can only take attendance for today.','bad');
  const blk=attBlock();if(blk)return toast(blk,'bad');
  const k=attDate+'|'+attCls;if(db.attendance[k]&&!isAdmin())return toast('Already saved and locked.','bad');
  const marks={},times={};let pend=0;
  db.students.filter(s=>s.cls===attCls).forEach(s=>{const r=document.querySelector(`input[name=m_${s.id}]:checked`);
    if(!r){pend++;marks[s.id]='A'}else{marks[s.id]=r.value;if(r.value==='P'&&attTimes[s.id])times[s.id]=attTimes[s.id]}});
  if(pend&&!confirm(pend+' student(s) are not marked yet and will be saved as Absent (−5 marks). Continue?'))return;

  db.attendance[k]={date:attDate,cls:attCls,by:S.u,at:Date.now(),marks,times};attKey=k;attTimes=times;
  await audit(edit?'ATT_EDIT':'ATT_SAVE',attCls+' '+attDate);await save();render();toast('Attendance saved');
}

  <td>${isAdmin()?`<input type="number" min="0" max="${DISC_MAX}" step="0.5" value="${x.disc==null?'':x.disc}" placeholder="–" style="width:76px" onclick="event.stopPropagation()" onchange="setDisc('${s.id}',this.value)">`:(x.disc==null?'<span class="mut">–</span>':x.disc)}</td>
  <td>${x.disc==null?`<div class="mut">${x.att} + ? / 100</div><span class="tag t-warn">Waiting for discipline</span>`:`<div style="display:flex;gap:10px;align-items:center">${pbar(x.total,rateColor(x.total))}<span class="tag" style="--c:${rateColor(x.total)}">${x.total}/100 · ${x.total}%</span></div><div class="mut">${x.att} + ${x.disc} = ${x.total}</div>`}</td><td><span class="tag ${sg[0]}">${x.rate==null?'No data':x.rate+'% · '+sg[1]}</span></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">No students.</td></tr>'}</tbody></table></div>

function finalCard(R){

  ${done.length?`<div class="wrap"><table><thead><tr><th>Rank</th><th>Student</th><th>Attendance /90</th><th>Discipline /10</th><th>Full marks /100</th></tr></thead><tbody>${done.map((r,i)=>`<tr class="clk" onclick="stuDetail('${r.s.id}')"><td><b>${i+1}</b></td><td><b>${esc(r.s.name)}</b></td><td>${r.x.att}</td><td>${r.x.disc}</td><td><div style="display:flex;gap:10px;align-items:center">${pbar(r.x.total,rateColor(r.x.total))}<b style="font-size:17px;color:${rateColor(r.x.total)}">${r.x.total}%</b></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Enter discipline marks in the table above to see full marks out of 100%.</div>'}</div>`;

async function setDisc(id,v){if(!isAdmin())return;
  if(!isAdmin())return;const k=rPS+'|'+id;
  if(v===''){delete db.disc[k]}else{const n=Math.round(parseFloat(v)*2)/2;if(isNaN(n)||n<0||n>DISC_MAX){render();return toast('Discipline must be between 0 and 10','bad')}db.disc[k]=n}

async function newPeriod(){if(!isAdmin())return;

async function addStu(){if(!isAdmin())return;
  let n=0;
  for(const ln of $('bulk').value.split('\n')){const p=ln.split(',').map(x=>clean(x));if(p[0]&&p[1]){db.students.push({id:uid(),name:p[0],cls:p[1],reg:p[2]||'',phone:uniqPhone(p[3])});n++}}
  if(!n)return toast('Use the format: Name, Class','bad');
  await audit('STU_ADD',n+' students');await save();render();toast(n+' students added');
}
async function delStu(id){if(!isAdmin())return;
  const s=db.students.find(x=>x.id===id);if(!s||!confirm('Delete '+s.name+'? Their login is removed too; saved attendance records stay.'))return;
  if(portalRemoteReady){
    try{await portalRequest('POST',{action:'delete-student-record',accountId:id})}
    catch(error){toast(error.message,'bad');return}
  }
  const gone=db.users.filter(x=>x.sid===id).map(x=>x.id);db.subs=db.subs.filter(x=>x.sid!==id);db.posts=db.posts.filter(p=>!gone.includes(p.uid));db.students=db.students.filter(x=>x.id!==id);db.users=db.users.filter(x=>x.sid!==id);await audit('STU_DEL',s.name);await save();render();
}

/* ================= STOCK: overview ================= */
const E='Embedded System',I='IoT System',CATS=[E,I];
const CATC={'Embedded System':'var(--pri)','IoT System':'var(--acc)'};
const stState=i=>i.qty<=0?'empty':i.qty<=i.min?'low':'ok';
const catTag=c=>`<span class="tag" style="--c:${CATC[c]||'var(--mut)'}">${esc(c||'—')}</span>`;
function catStats(c){const l=db.items.filter(i=>i.cat===c);return{n:l.length,u:l.reduce((s,i)=>s+i.qty,0),low:l.filter(i=>stState(i)==='low').length,emp:l.filter(i=>stState(i)==='empty').length,list:l}}
function catPanel(c){
  const s=catStats(c),ok=s.n-s.low-s.emp,top=s.list.slice().sort((a,b)=>b.qty-a.qty).slice(0,5),mx=Math.max(1,...top.map(i=>i.qty));
  return `<div class="card catcard" style="--c:${CATC[c]}"><h2><span class="dot"></span>${c}<span class="mut" style="margin-left:auto">${s.n} components · ${fmt(s.u)} units</span></h2>
  ${s.n?donut([{l:'Healthy',v:ok,c:'var(--ok)'},{l:'Low',v:s.low,c:'var(--warn)'},{l:'Empty',v:s.emp,c:'var(--bad)'}],Math.round(ok/s.n*100)+'%','healthy')+'<h3>Most stocked</h3>'+top.map(i=>`<div class="lrow"><span>${esc(i.name)}<div class="mut">${esc(i.type||'')}</div></span>${pbar(i.qty/mx*100,CATC[c])}<b>${fmt(i.qty)}</b></div>`).join(''):`<div class="empty">No ${c} components yet.${isAdmin()?'<div class="acts" style="justify-content:center"><button class="sm" onclick="itemForm()">+ Add component</button></div>':''}</div>`}</div>`;
}
function vSdash(){
  const it=db.items,low=it.filter(i=>stState(i)==='low').length,emp=it.filter(i=>stState(i)==='empty').length,units=it.reduce((s,i)=>s+i.qty,0);
  const week=lastDays(7).map(d=>{let a=0,b=0;db.moves.forEach(m=>{if(new Date(m.t-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)===d){m.type==='in'?a+=m.qty:b+=m.qty}});return{l:dayLbl(d),a,b}});
  const alerts=it.filter(i=>stState(i)!=='ok').sort((a,b)=>a.qty/(a.min||1)-b.qty/(b.min||1)).slice(0,6);
  const recent=db.moves.slice(-6).reverse();
  return `${hero()}
  <div class="stats">
   ${stat('Components',fmt(it.length),'box','var(--pri)',0)}
   ${stat('Units in stock',fmt(units),'list','var(--acc)',70)}
   ${stat('Low stock',fmt(low),'warn','var(--warn)',140)}
   ${stat('Out of stock',fmt(emp),'x','var(--bad)',210)}
  </div>
  <div class="grid2">${catPanel(E)}${catPanel(I)}</div>
  <div class="grid2" style="margin-top:18px">
   <div class="card"><h2>Movements – last 7 days <span class="mut">(<span style="color:var(--ok)">■</span> in / <span style="color:var(--bad)">■</span> out)</span></h2>${gbars(week,'var(--ok)','var(--bad)')}</div>
   <div class="card"><h2>Reorder alerts</h2>${alerts.length?alerts.map(i=>`<div class="lrow"><span>${esc(i.name)}<div class="mut">${catTag(i.cat)} min ${i.min}</div></span>${pbar(i.min?i.qty/(i.min*2)*100:0,i.qty<=0?'var(--bad)':'var(--warn)')}<b>${i.qty}</b></div>`).join(''):'<div class="empty">Everything is well stocked. ✅</div>'}</div>
  </div>
  <div class="card" style="margin-top:18px"><h2>Latest movements</h2><div class="wrap"><table><thead><tr><th>When</th><th>Component</th><th>Type</th><th>Qty</th><th>Reason</th><th>By</th></tr></thead><tbody>
  ${recent.map(m=>`<tr><td>${new Date(m.t).toLocaleString()}</td><td><b>${esc(m.name)}</b></td><td><span class="tag ${m.type==='in'?'t-ok':'t-bad'}">${m.type==='in'?'IN':'OUT'}</span></td><td>${m.qty}</td><td>${esc(m.reason)}</td><td>${esc(m.by)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No movements yet.</td></tr>'}</tbody></table></div></div>`;
}

/* ================= STOCK: components ================= */
let sq='',sf='all',sc='all';
function vItems(){
  const cnt=c=>db.items.filter(i=>c==='all'||i.cat===c).length;
  return `<div class="card"><div class="tabs">${['all',...CATS].map(c=>`<button class="tabb ${sc===c?'on':''}" style="--c:${CATC[c]||'var(--pri)'}" onclick="sc='${c}';render()">${c==='all'?'All components':c}<span>${cnt(c)}</span></button>`).join('')}</div>

  ${isAdmin()?'<div style="flex:0;display:flex;gap:8px"><button style="white-space:nowrap" onclick="itemForm()">+ New component</button><button class="sec" style="white-space:nowrap" onclick="bulkForm()">Add several</button></div>':''}</div>

function drawItems(){
  const el=$('itb');if(!el)return;const q=sq.toLowerCase();
  const list=db.items.filter(i=>(sc==='all'||i.cat===sc)&&((i.name+' '+(i.type||'')+' '+(i.loc||'')).toLowerCase().includes(q))&&(sf==='all'||stState(i)===sf)).sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||a.name.localeCompare(b.name));
  el.innerHTML=list.map(i=>{const s=stState(i);return `<tr><td><b>${esc(i.name)}</b>${i.loc?`<div class="mut">📍 ${esc(i.loc)}</div>`:''}</td><td>${catTag(i.cat)}</td><td>${esc(i.type||'—')}</td><td><b>${fmt(i.qty)}</b> ${esc(i.unit)}</td><td><span class="tag ${s==='ok'?'t-ok':s==='low'?'t-warn':'t-bad'}">${s==='ok'?'OK':s==='low'?'Low':'Empty'}</span></td>

}
function itemForm(id){if(!isAdmin())return;
  const i=id?db.items.find(x=>x.id===id):{name:'',cat:sc!=='all'?sc:E,type:'',loc:'',unit:'pcs',qty:0,min:5};
  openModal(`<h2>${id?'Edit':'New'} component</h2><label>Name</label><input id="f1" value="${esc(i.name)}" maxlength="60" placeholder="e.g. ESP32 DevKit">
  <label>System</label><select id="f2" onchange="typeList()">${CATS.map(c=>`<option ${i.cat===c?'selected':''}>${c}</option>`).join('')}</select>
  <label>Type</label><input id="f6" list="tl" value="${esc(i.type||'')}" maxlength="40"><datalist id="tl"></datalist>
  <div class="row"><div><label>Shelf / location</label><input id="f7" value="${esc(i.loc||'')}" maxlength="30" placeholder="e.g. A2"></div><div><label>Unit</label><input id="f3" value="${esc(i.unit)}" maxlength="15"></div></div>
  <label>${id?'Quantity in stock':'Opening quantity'}</label><input id="f4" type="number" min="0" value="${id?i.qty:0}">${id?'<div class="mut">Changing this records an admin correction in Movements.</div>':''}<label>Low-stock level</label><input id="f5" type="number" min="0" value="${i.min}">
  <div class="acts"><button onclick="saveItem('${id||''}')">Save</button><button class="sec" onclick="closeModal()">Cancel</button></div>`);

function typeList(){const d=$('tl');if(d){const c=$('f2').value;d.innerHTML=[...new Set(db.items.filter(i=>i.cat===c&&i.type).map(i=>i.type))].map(t=>`<option value="${esc(t)}">`).join('')}}
async function saveItem(id){if(!isAdmin())return;
  if(!isAdmin())return toast('Only the administrator can add or change components.','bad');
  const name=clean($('f1').value),cat=$('f2').value,type=clean($('f6').value,40),loc=clean($('f7').value,30),unit=clean($('f3').value,15)||'pcs',min=Math.max(0,parseInt($('f5').value)||0);
  if(!name)return toast('Name is required','bad');if(!CATS.includes(cat))return toast('Choose Embedded System or IoT System','bad');
  if(id){const i=db.items.find(x=>x.id===id),nq=Math.max(0,parseInt($('f4').value)||0);Object.assign(i,{name,cat,type,loc,unit,min});
    if(nq!==i.qty){const df=nq-i.qty;db.moves.push({t:Date.now(),id:i.id,name,type:df>0?'in':'out',qty:Math.abs(df),reason:'Admin correction ('+i.qty+' → '+nq+')',by:S.u});i.qty=nq}
    await audit('ITEM_EDIT',name)}
  else{const qty=Math.max(0,parseInt($('f4').value)||0);const it={id:uid(),name,cat,type,loc,unit,qty,min};db.items.push(it);
    if(qty)db.moves.push({t:Date.now(),id:it.id,name,type:'in',qty,reason:'Opening balance',by:S.u});await audit('ITEM_ADD',name+' ['+cat+']')}
  await save();closeModal();render();toast('Component saved');
}
function bulkForm(){if(!isAdmin())return;
  if(!isAdmin())return;
  openModal(`<h2>Add several components</h2><div class="mut">One per line: Name, System, Type, Quantity, Shelf<br>System = Embedded or IoT. Only Name and System are required.</div>
  <textarea id="bulk2" rows="8" placeholder="Name, System, Type, Quantity, Shelf"></textarea>
  <div class="acts"><button onclick="doBulk()">Add</button><button class="sec" onclick="closeModal()">Cancel</button></div>`);
}
async function doBulk(){if(!isAdmin())return;
  if(!isAdmin())return;
  const have=new Set(db.items.map(i=>i.name.toLowerCase()));let n=0,skip=0;
  for(const ln of $('bulk2').value.split('\n')){
    const p=ln.split(',').map(x=>clean(x));if(!p[0])continue;
    const cat=/^i/i.test(p[1]||'')?I:/^e/i.test(p[1]||'')?E:null;
    if(!cat||have.has(p[0].toLowerCase())){skip++;continue}
    const qty=Math.max(0,parseInt(p[3])||0),it={id:uid(),name:p[0],cat,type:p[2]||'',loc:p[4]||'',unit:'pcs',qty,min:5};
    db.items.push(it);have.add(p[0].toLowerCase());n++;
    if(qty)db.moves.push({t:Date.now(),id:it.id,name:it.name,type:'in',qty,reason:'Opening balance',by:S.u});
  }
  if(!n)return toast('Nothing added. Use: Name, Embedded/IoT, Type, Quantity, Shelf','bad');
  await audit('ITEM_BULK',n+' components');await save();closeModal();render();toast(n+' components added'+(skip?' ('+skip+' skipped)':''));
}
function moveForm(id,type){if(!isAdmin())return;
  const i=db.items.find(x=>x.id===id);
  openModal(`<h2>${type==='in'?'Stock in':'Stock out'} · ${esc(i.name)}</h2><div class="mut">${esc(i.cat||'')} · currently ${fmt(i.qty)} ${esc(i.unit)}</div>
  <label>Quantity</label><input id="f1" type="number" min="1" step="1"><label>Reason / project / who took it</label><input id="f2" maxlength="80" placeholder="${type==='in'?'Purchase, donation…':'Project, class, lab…'}">
  <div class="acts"><button class="${type==='in'?'ok':''}" onclick="doMove('${id}','${type}')">Confirm</button><button class="sec" onclick="closeModal()">Cancel</button></div>`);
}
async function doMove(id,type){if(!isAdmin())return;
  const i=db.items.find(x=>x.id===id),q=parseInt($('f1').value),r=clean($('f2').value,80);
  if(!q||q<1)return toast('Enter a valid quantity','bad');if(!r)return toast('A reason is required','bad');
  if(type==='out'&&q>i.qty)return toast('Not enough stock – only '+i.qty+' left','bad');
  i.qty+=type==='in'?q:-q;db.moves.push({t:Date.now(),id,name:i.name,type,qty:q,reason:r,by:S.u});
  await audit('STOCK_'+type.toUpperCase(),`${i.name} x${q} (${r})`);await save();closeModal();render();toast('Stock updated');
}
async function delItem(id){if(!isAdmin())return;
  if(!isAdmin())return;
  const i=db.items.find(x=>x.id===id);if(!confirm('Delete '+i.name+'?'))return;
  db.items=db.items.filter(x=>x.id!==id);await audit('ITEM_DEL',i.name);await save();render();
}
function stockCsv(){if(!isAdmin())return;
  const rows=[['Component','System','Type','Location','Qty','Unit','Low level']].concat(db.items.map(i=>[i.name,i.cat,i.type||'',i.loc||'',i.qty,i.unit,i.min]));
  download('charles-tech_stock_'+today()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');audit('EXPORT','stock csv').then(save);
}

function vAdm(){
  return `  <div class="card"><h2>Users</h2><div class="mut">Students create accounts from the sign-in screen; user accounts and password resets are stored on the server.</div><div class="wrap"><table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th></th></tr></thead><tbody>
  ${db.users.map(u=>`<tr><td><b>${esc(u.u)}</b></td><td>${esc(u.name)}</td><td><span class="tag ${u.role==='admin'?'t-info':'t-ok'}">${u.role}</span></td><td><div class="acts" style="margin:0"><button class="sec sm" onclick="resetPw('${u.id}')">Reset password</button>${u.id!==S.id?`<button class="bad sm" onclick="delUser('${u.id}')">Delete</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>

  <div class="card"><h2>Audit log</h2><div class="acts" style="margin:0 0 12px"><button class="sec sm" onclick="chkLog()">Check log integrity</button><span id="logmsg"></span></div>

  ${db.log.slice(-60).reverse().map(e=>`<tr><td>${new Date(e.t).toLocaleString()}</td><td>${esc(e.u)}</td><td><span class="tag ${/FAIL|DEL|RESET|RESTORE/.test(e.a)?'t-bad':'t-info'}">${esc(e.a)}</span></td><td>${esc(e.d)}</td></tr>`).join('')}</tbody></table></div></div>`;

async function syncPortal(){
  if(!isAdmin())return;
  if(!confirm(`Upload this browser copy and replace the current MySQL portal data${portalServerAvailable?' at revision '+portalRevision:''}? Keep a downloaded backup first.`))return;
  try{await audit('DATABASE_IMPORT','browser data');const result=await portalRequest('PUT',db);portalRevision=result.revision;portalRemoteReady=true;render();toast('Portal data uploaded to MySQL')}
  catch(error){toast(error.message,'bad');console.error('Could not import Student Portal data into MySQL.',error)}
}
async function adminStudentRequest(action,payload){
  const response=await fetch(portalApiUrl,{method:'POST',credentials:'same-origin',headers:{'Accept':'application/json','Content-Type':'application/json','X-CSRF-Token':portalCsrf},body:JSON.stringify({action,...payload})});
  let result={};try{result=await response.json()}catch(error){throw new Error('The student account service returned an invalid response.')}
  if(!response.ok)throw new Error(result.error||'Could not update the student account.');
  return result;
}
async function pullPortal(){
  if(!isAdmin())return;
  if(!confirm('Replace this browser copy with the current MySQL portal data?'))return;
  try{
    const result=await portalRequest('GET');
    if(!result.state){toast('No Student Portal data has been uploaded to MySQL yet.','bad');return}
    const parsed=JSON.parse(result.state.state_json);
    db=Object.assign(blank(),parsed);migrate();tampered=false;
    portalRevision=Number(result.state.revision)||0;portalRemoteReady=true;
    await audit('DATABASE_RESTORE','revision '+portalRevision);await save();render();toast('Loaded the MySQL portal copy')
  }catch(error){toast(error.message,'bad');console.error('Could not load Student Portal data from MySQL.',error)}
}
async function chkLog(){if(!isAdmin())return;const b=await verifyLog();$('logmsg').innerHTML=b<0?'<span class="tag t-ok">Log is intact</span>':'<span class="tag t-bad">Log altered near entry #'+b+'</span>'}
function resetPw(id){if(!isAdmin())return;
  const u=db.users.find(x=>x.id===id);if(isSiteAdminUser(u))return toast('The administrator password is changed on the website','bad');
  openModal(`<h2>Reset password · ${esc(u.u)}</h2><label>New temporary password (min 8)</label>${pwf('f1','new-password')}
  <div class="acts"><button onclick="doReset('${id}')">Reset</button><button class="sec" onclick="closeModal()">Cancel</button></div>`);
}
async function doReset(id){if(!isAdmin())return;
  const p=$('f1').value;if(p.length<8)return toast('Password too short','bad');const u=db.users.find(x=>x.id===id);if(isSiteAdminUser(u))return;
  try{await adminStudentRequest('reset-password',{accountId:id,password:p})}
  catch(error){toast(error.message,'bad');return}
  u.mc=true;await audit('PW_RESET',u.u);await save();closeModal();toast('Done – user must change it at next sign-in');
}
async function delUser(id){if(!isAdmin())return;
  const u=db.users.find(x=>x.id===id);if(isSiteAdminUser(u))return toast('The website administrator cannot be deleted','bad');if(u.role==='admin'&&db.users.filter(x=>x.role==='admin').length<2)return toast('Cannot delete the last administrator','bad');
  if(!confirm('Delete user '+u.u+'?'))return;
  if(u.role==='student'&&u.sid){try{await adminStudentRequest('delete-student',{accountId:id})}catch(error){toast(error.message,'bad');return}}
  db.users=db.users.filter(x=>x.id!==id);await audit('USER_DEL',u.u);await save();render();
}
function changePw(forced){
  if(S&&ADM_EMAIL&&S.u===ADM_EMAIL)return toast('Change the administrator password on the website','bad');
  openModal(`<h2>${forced?'Set a new password':'Change password'}</h2>${forced?'<div class="mut">You must replace your temporary password.</div>':''}
  <label>Current password</label>${pwf('f1','current-password')}<label>New password (min 8)</label>${pwf('f2','new-password')}<label>Confirm</label>${pwf('f3','new-password')}
  <div class="acts"><button onclick="doChange()">Save</button>${forced?'':'<button class="sec" onclick="closeModal()">Cancel</button>'}</div>`);
}
async function doChange(){
  const u=db.users.find(x=>x.id===S.id);
  if(S&&S.role==='student'){
    const next=$('f2').value;
    if(next.length<8||next.length>72)return toast('New password must be between 8 and 72 characters','bad');
    if(next!==$('f3').value)return toast('Passwords do not match','bad');
    try{
      await portalStudentRequest('POST',{action:'password',currentPassword:$('f1').value,newPassword:next});
      if(u){u.mc=false;u.salt='';u.h=''}
      closeModal();await save();toast('Password changed');
    }catch(error){toast(error.message,'bad');console.error('Could not change student password.',error)}
    return;
  }
  if(!safeEq(await hashPw($('f1').value,u.salt),u.h))return toast('Current password is wrong','bad');
  const n=$('f2').value;if(n.length<8)return toast('New password must be at least 8 characters','bad');if(n!==$('f3').value)return toast('Passwords do not match','bad');
  if(n===$('f1').value)return toast('Choose a different password','bad');
  u.salt=newSalt();u.h=await hashPw(n,u.salt);u.mc=false;await audit('PW_CHANGE',u.u);await save();closeModal();toast('Password changed');
}
async function backup(){if(!isAdmin())return;await audit('BACKUP','');await save();download('charles-tech_backup_'+today()+'.json',JSON.stringify(db),'application/json')}
async function restore(inp){if(!isAdmin())return;
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.users)||!Array.isArray(d.students)||!Array.isArray(d.items)||!d.attendance)throw 0;
    if(!confirm('This replaces ALL current data with the backup. Continue?'))return;
    db=Object.assign(blank(),d);migrate();tampered=false;await audit('RESTORE',f.name);await save();logout('Restored from backup – please sign in again.');
  }catch(e){toast('Invalid backup file','bad')}
}
$('modalbg').addEventListener('mousedown',e=>{if(e.target.id==='modalbg'&&!(db.users.find(x=>S&&x.id===S.id)||{}).mc)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!(db.users.find(x=>S&&x.id===S.id)||{}).mc)closeModal()});

init();
</script>
